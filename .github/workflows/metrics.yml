name: Metrics

on:
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mazume-tech-club
          template: classic
          base: ""
          filename: profile/metrics.languages.svg
          output_action: commit
          committer_branch: main
          commit_message: "chore: update language metrics [skip ci]"
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, dockerfile

  stats:
    needs: languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aggregate org stats
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: bash scripts/org-stats.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats
          git diff --cached --quiet || git commit -m "chore: update org stats [skip ci]"
          git push
